<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="URL pattern monitoring and redirect tracking for Elasticsearch proxy logs" />
    <title>uNetWatch</title>
    <script>
      // Apply theme before paint to avoid FOUC. Defaults to dark.
      // Reads the legacy "elk-theme" key as a fallback for existing installs.
      (function () {
        try {
          var t = localStorage.getItem("unetwatch-theme") || localStorage.getItem("elk-theme");
          if (t === "light") {
            document.documentElement.classList.add("light");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
