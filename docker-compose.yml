services:
  app:
    build: .
    image: unetwatch:latest
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      ELASTIC_HOST: ${ELASTIC_HOST:-http://es:9200}
      ELASTIC_INDEX: ${ELASTIC_INDEX:-logstash-proxy-*}
      ELASTIC_USER: ${ELASTIC_USER:-elastic}
      ELASTIC_PASS: ${ELASTIC_PASS:-changeme}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-changeme}
      API_KEY: ${API_KEY:-}
      # Operator display zone for Findings "Detected" / Analytics / report.
      # Passed through from .env; empty → the app follows the container's
      # system zone (TZ, /etc/timezone, /etc/localtime), then UTC.
      DISPLAY_TZ: ${DISPLAY_TZ:-}
    volumes:
      - unetwatch-data:/app/data
    restart: unless-stopped

  # Optional bundled Elasticsearch. Enable with:
  #   docker compose --profile es up
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["es"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  unetwatch-data:
  es-data:
