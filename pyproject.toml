[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unetwatch"
version = "1.0.0"
description = "URL pattern monitoring and redirect tracking for Elasticsearch proxy logs"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Yusuf Umar" }]
keywords = ["elasticsearch", "monitoring", "url-patterns", "redirect-tracking", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
    "elasticsearch[async]>=8.15.0",
    "pandas>=2.2.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
unetwatch = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]